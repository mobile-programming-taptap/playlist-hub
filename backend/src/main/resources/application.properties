spring.application.name=taptap
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/taptap;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
taptap.openai.key=${OPENAI_API_KEY:}
taptap.openai.model=${OPENAI_MODEL:gpt-4o-mini}
taptap.openai.endpoint=${OPENAI_ENDPOINT:https://api.openai.com/v1/responses}
taptap.ai.daily-limit=${AI_DAILY_LIMIT:200}
taptap.ai.user-hourly-limit=${AI_USER_HOURLY_LIMIT:20}
