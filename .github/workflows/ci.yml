name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: taptap_check
          POSTGRES_USER: taptap_check
          POSTGRES_PASSWORD: local-check-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taptap_check -d taptap_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Check backend and core
        working-directory: backend
        run: bash ../android/gradlew test bootJar --no-daemon --no-configuration-cache

      - name: Check packaged server restart
        working-directory: backend
        run: python3 ../tools/check_server.py build/libs/taptap-backend.jar

      - name: Check PostgreSQL storage
        working-directory: backend
        env:
          TAPTAP_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/taptap_check
          TAPTAP_TEST_DATABASE_USER: taptap_check
          TAPTAP_TEST_DATABASE_PASSWORD: local-check-only
        run: bash ../android/gradlew test --rerun-tasks --no-daemon --no-configuration-cache

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Build Android debug and release and check lint
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug --no-daemon --no-configuration-cache
